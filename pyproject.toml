[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bqrlg"
version = "0.1.0"
description = "Quantum circuit tools for BDD-encoded regular languages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dd>=0.6",
    "matplotlib>=3.7",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]

[project.scripts]
bqrlg = "bqrlg.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
